<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه پایلوت | عملیات تجارت داخلی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1a73b8;
    --primary-soft:#e8f1fa;
    --bg:#f5f7fa;
    --surface:#ffffff;
    --border:#e4e8ee;
    --text:#2f3b4c;
    --muted:#7a8699;
    --radius:10px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:var(--bg);
    color:var(--text);
    direction:rtl;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Layout ---------- */
  .app{
    display:flex;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:262px;
    flex-shrink:0;
    background:var(--surface);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
  }
  .brand-logo{
    width:34px; height:34px;
    border-radius:9px;
    background:linear-gradient(135deg,#1a73b8,#2fa4d8);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    flex-shrink:0;
  }
  .brand-text b{ display:block; font-size:14px; font-weight:600; }
  .brand-text span{ font-size:11px; color:var(--muted); }

  .nav{ padding:12px 8px; }

  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    font-weight:500;
    color:var(--text);
    user-select:none;
    transition:background .15s;
  }
  .nav-item:hover{ background:#f2f5f9; }
  .nav-item.active{ background:var(--primary-soft); color:var(--primary); }

  .nav-item .chev{
    margin-inline-start:auto;
    transition:transform .2s;
    color:var(--muted);
  }
  .nav-item.open .chev{ transform:rotate(-90deg); }

  .submenu{
    overflow:hidden;
    max-height:0;
    transition:max-height .25s ease;
  }
  .submenu.open{ max-height:300px; }

  .submenu a{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    margin:2px 0 2px 6px;
    padding-inline-start:34px;
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
    border-radius:var(--radius);
    position:relative;
    transition:background .15s, color .15s;
  }
  .submenu a::before{
    content:"";
    position:absolute;
    inset-inline-start:16px;
    width:6px; height:6px;
    border-radius:50%;
    background:#cbd4e0;
    transition:background .15s;
  }
  .submenu a:hover{ background:#f2f5f9; color:var(--text); }
  .submenu a.active{ background:var(--primary-soft); color:var(--primary); font-weight:600; }
  .submenu a.active::before{ background:var(--primary); }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    height:64px;
    flex-shrink:0;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:0 24px;
  }

  .breadcrumb{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--muted);
    font-size:13px;
  }
  .breadcrumb .home{
    display:flex; align-items:center; gap:6px;
    color:var(--text);
    font-weight:500;
    text-decoration:none;
  }
  .breadcrumb .sep{ color:#c8d0db; }
  .breadcrumb .current{ color:var(--primary); font-weight:500; }

  .role-box{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .role-box label{
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  .role-box select{
    font-family:inherit;
    font-size:13px;
    color:var(--text);
    background:#f7f9fc;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 12px;
    min-width:210px;
    outline:none;
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
  }
  .role-box select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(26,115,184,.12);
    background:#fff;
  }

  /* ---------- Content ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding:24px;
  }

  .empty-state{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--muted);
    text-align:center;
  }
  .empty-state svg{ opacity:.45; }

  /* ---------- Card / Form ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 1px 3px rgba(16,24,40,.04);
    animation:fadeUp .25s ease;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
  }
  .card-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    font-weight:600;
  }
  .card-title .bar{
    width:4px; height:20px;
    border-radius:4px;
    background:var(--primary);
  }

  .badge{
    font-size:11px;
    font-weight:500;
    padding:4px 10px;
    border-radius:20px;
    background:#fff4e5;
    color:#b26a00;
  }

  .card-body{ padding:20px; }

  .form-placeholder{
    border:2px dashed #d8e0ea;
    border-radius:12px;
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
    background:#fafcfe;
  }
  .form-placeholder b{
    display:block;
    color:var(--text);
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
  }
  .form-placeholder span{ font-size:12.5px; }
</style>
</head>
<body>

<div class="app">

  <!-- ================= Sidebar ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
        </svg>
      </div>
      <div class="brand-text">
        <b>سامانه پایلوت</b>
        <span>نسخه آزمایشی</span>
      </div>
    </div>

    <nav class="nav">
      <!-- منوی اصلی -->
      <div class="nav-item open" id="menuTrade">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 4.6A1 1 0 0 0 5.6 19H19"/>
          <circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>
        </svg>
        <span>عملیات تجارت داخلی</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>

      <!-- زیرمنو -->
      <div class="submenu open" id="submenuTrade">
        <a href="#" data-form="trade-permit" class="active">درخواست مجوز تجاری</a>
      </div>
    </nav>
  </aside>

  <!-- ================= Main ================= -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">
      <!-- سمت راست: مسیر صفحه -->
      <div class="breadcrumb">
        <a href="#" class="home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
          </svg>
          خانه
        </a>
        <span class="sep">›</span>
        <span>عملیات تجارت داخلی</span>
        <span class="sep">›</span>
        <span class="current" id="breadcrumbCurrent">درخواست مجوز تجاری</span>
      </div>

      <!-- سمت چپ: انتخاب نقش -->
      <div class="role-box">
        <label for="roleSelect">نقش:</label>
        <select id="roleSelect">
          <option value="producer">تولیدکننده</option>
          <option value="domestic-trader">تاجر داخلی</option>
          <option value="legal-rep">نماینده تاجر حقیقی</option>
          <option value="legal-entity">شخص حقوقی</option>
        </select>
      </div>
    </header>

    <!-- Content -->
    <main class="content" id="content">
      <!-- فرم به صورت داینامیک اینجا رندر می‌شود -->
    </main>

  </div>
</div>

<script>
  /* ---------- داده‌های منو ---------- */
  const FORMS = {
    'trade-permit': {
      title: 'درخواست مجوز تجاری',
      breadcrumb: 'درخواست مجوز تجاری'
    }
  };

  const contentEl = document.getElementById('content');
  const breadcrumbCurrent = document.getElementById('breadcrumbCurrent');
  const submenuLinks = document.querySelectorAll('.submenu a');

  /* ---------- رندر فرم ---------- */
  function renderForm(key){
    const form = FORMS[key];
    if(!form) return;

    breadcrumbCurrent.textContent = form.breadcrumb;

    contentEl.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span class="bar"></span>
            ${form.title}
          </div>
          <span class="badge">پیش‌نویس</span>
        </div>
        <div class="card-body">
          <div class="form-placeholder">
            <b>محل قرارگیری فیلدهای فرم</b>
            <span>در گام بعدی، اجزای فرم درخواست مجوز تجاری در این بخش اضافه خواهد شد.</span>
          </div>
        </div>
      </div>
    `;
  }

  /* ---------- حالت خالی ---------- */
  function renderEmpty(){
    contentEl.innerHTML = `
      <div class="empty-state">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="13" y2="17"/>
        </svg>
        <div>برای شروع، یک فرایند را از منوی کناری انتخاب کنید.</div>
      </div>
    `;
  }

  /* ---------- آکاردئون منو ---------- */
  const menuTrade = document.getElementById('menuTrade');
  const submenuTrade = document.getElementById('submenuTrade');

  menuTrade.addEventListener('click', () => {
    menuTrade.classList.toggle('open');
    submenuTrade.classList.toggle('open');
  });

  /* ---------- کلیک روی آیتم‌های زیرمنو ---------- */
  submenuLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();

      submenuLinks.forEach(l => l.classList.remove('active'));
      link.classList.add('active');

      renderForm(link.dataset.form);
    });
  });

  /* ---------- تغییر نقش ---------- */
  document.getElementById('roleSelect').addEventListener('change', (e) => {
    console.log('نقش فعال:', e.target.value);
  });

  /* ---------- مقدار اولیه ---------- */
  renderForm('trade-permit');
</script>

</body>
</html>
